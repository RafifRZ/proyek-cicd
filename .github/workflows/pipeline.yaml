name: Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Lint HTML & JS
        run: |
          npx htmlhint index.html
          npx eslint@8 script.js --env browser

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Add Docker CLI to PATH
        shell: powershell
        run: |
          $dockerCliPath = "C:\Program Files\Docker\Docker\resources\bin"
          if (-not (Test-Path (Join-Path $dockerCliPath "docker.exe"))) {
            throw "Docker CLI was not found at $dockerCliPath. Install Docker Desktop on the runner."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dockerCliPath
      - name: Verify Docker is available
        shell: powershell
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is installed but the engine is unavailable. Start Docker Desktop on the runner."
          }
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy container
        shell: powershell
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          if ($env:APP_PORT -notmatch '^\d+$' -or [int]$env:APP_PORT -lt 1 -or [int]$env:APP_PORT -gt 65535) {
            throw "APP_PORT must be configured as a port number between 1 and 65535."
          }

          $image = "ghcr.io/${{ github.repository }}:latest"
          docker pull $image
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull image $image."
          }

          $existingContainer = docker ps -aq --filter "name=^/web-app$"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check for an existing web-app container."
          }
          if ($existingContainer) {
            docker stop web-app
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to stop the existing web-app container."
            }
            docker rm web-app
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove the existing web-app container."
            }
          }

          docker run -d --restart unless-stopped --name web-app -p "$($env:APP_PORT):80" $image
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start the web-app container."
          }
      - name: Health check
        shell: powershell
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri "http://localhost:$env:APP_PORT" -TimeoutSec 10
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "Health check failed with HTTP status $($response.StatusCode)."
          }